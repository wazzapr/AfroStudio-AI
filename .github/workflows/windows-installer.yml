name: Windows installer

on:
  push:
    branches: ["feat/studio-foundation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python for bundling the local bridge
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Bundle local bridge executable
        run: pyinstaller --noconfirm --clean --onefile --name AfroStudioLocalEngine --distpath release-engine local-engine/server.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run build && npx electron-builder --win nsis --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AfroStudio-AI-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish rolling nightly installer release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: AfroStudio AI Nightly
          body: |
            Automated development build of AfroStudio AI for Windows.

            This is a pre-release for testing. Back up your projects before updating.
            The installer includes the desktop app and local bridge, but does not include an AI model.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release/*.exe
